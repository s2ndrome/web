<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNDROME &amp; LIA</title>
<meta name="description" content="SYNDROME &amp; LIA">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="site-header">
    <a href="#" class="logo" data-menu="home">SYNDROME &amp; LIA</a>
    <nav class="site-nav" aria-label="주요 메뉴">
      <button type="button" data-menu="seol">SEOL</button>
      <button type="button" data-menu="gallery">GALLERY</button>
      <button type="button" data-menu="log">LOG</button>
      <button type="button" data-menu="share">SHARE</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="slider" aria-roledescription="carousel">
      <div class="hero-track" id="sliderTrack">
        <div class="hero-slide">
          <span class="hero-placeholder">이미지 슬라이드</span>
        </div>
      </div>
      <button type="button" class="hero-arrow hero-arrow-prev" id="sliderPrev" aria-label="이전 이미지">‹</button>
      <button type="button" class="hero-arrow hero-arrow-next" id="sliderNext" aria-label="다음 이미지">›</button>
      <div class="hero-dots" id="sliderDots"></div>
    </section>

    <section class="content-row">
      <div class="ribbon" aria-hidden="true">
        <svg viewBox="0 0 300 190" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
            </filter>
          </defs>
          <g filter="url(#ribbonShadow)" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.5" stroke-linejoin="round">
            <path d="M150 96c-8-38-52-64-92-56-24 5-33 33-16 47 20 16 66 18 108 9z"/>
            <path d="M150 96c8-38 52-64 92-56 24 5 33 33 16 47-20 16-66 18-108 9z"/>
            <path d="M150 96c-30 6-52 30-58 62-3 17 15 29 28 18 18-16 26-50 30-80z"/>
            <path d="M150 96c30 6 52 30 58 62 3 17-15 29-28 18-18-16-26-50-30-80z"/>
            <circle cx="150" cy="97" r="15"/>
          </g>
        </svg>
      </div>

      <div class="chat" aria-hidden="true">
        <div class="bubble bubble-received">Do it! That&rsquo;s awesome</div>
        <div class="bubble bubble-sent">yea i&rsquo;m considering adopting another black cat</div>
      </div>
    </section>

    <footer class="player-bar">
      <button type="button" class="player-time" id="playerTime">00:00</button>
      <button type="button" class="player-toggle" id="playerToggle">bgm</button>
      <audio id="bgmAudio" loop preload="none" src="audio/bgm.mp3"></audio>
    </footer>
  </main>

</div>

<div class="menu-overlay" id="menuOverlay" aria-hidden="true">
  <div class="menu-backdrop" data-close="menu"></div>
  <div class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <button type="button" class="menu-close" data-close="menu" aria-label="닫기">×</button>
    <p class="menu-title" id="menuTitle">메뉴</p>
    <p class="menu-body" id="menuBody">준비 중입니다</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
